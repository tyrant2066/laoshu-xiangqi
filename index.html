<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>老叔之家象棋</title>
<link rel="stylesheet" href="css/style.css?v=3.1">
</head>
<body>
<div id="app">
  <header>
    <span id="logo">老叔之家象棋</span>
    <span id="status">欢迎来到老叔之家象棋</span>
  </header>

  <div id="boardWrap">
    <canvas id="board"></canvas>
  </div>

  <div id="captured">
    <span id="capRed" class="capLine">红方吃子：（无）</span>
    <span id="capBlack" class="capLine">黑方吃子：（无）</span>
  </div>

  <div id="bookNote" class="bookNote" hidden>
    <span id="bookStepLabel">棋谱研习</span>
    <span id="bookText"></span>
    <span id="voiceDebug" class="voiceDebug" hidden></span>
  </div>

  <div id="actionBar" class="bar">
    <button id="btnNew" class="btn bigBtn">开始</button>
    <button id="btnUndo" class="btn bigBtn">悔棋</button>
    <button id="btnSpeak" class="btn bigBtn" disabled>🔊 听讲解</button>
    <button id="btnGhost" class="btn bigBtn">刷新</button>
    <button id="btnSettings" class="btn bigBtn">设置</button>
  </div>

</div>

<div id="settingsModal" class="modal" hidden>
  <div class="modalBackdrop" id="modalBackdrop"></div>
  <div class="modalPanel" role="dialog" aria-modal="true">
    <h2>设置</h2>

    <div class="mGroup" id="mGroupMode">
      <div class="mLabel">对战模式</div>
      <div class="mBtns">
        <button id="mModeAI" class="btn mSel on">人机对战</button>
        <button id="mModeDuel" class="btn mSel">双人同屏</button>
        <button id="mModeBook" class="btn mSel">棋谱研习</button>
      </div>
      <div class="mHint" id="mModeBookHint" hidden>跟着棋谱学习经典开局,走对一步讲解一步</div>
    </div>

    <div class="mGroup" id="mGroupBook" hidden>
      <div class="mLabel">选择棋谱</div>
      <div class="bookList" id="bookList"></div>
    </div>

    <div class="mGroup" id="mGroupSpeak">
      <div class="mLabel">语音讲解</div>
      <div class="mBtns">
        <button id="mSpeakOn" class="btn mSel on">开启</button>
        <button id="mSpeakOff" class="btn mSel">关闭</button>
      </div>
    </div>

    <div class="mGroup" id="mGroupLevel">
      <div class="mLabel">AI 难度</div>
      <div class="mBtns">
        <button class="btn mSel on" data-level="1">新手</button>
        <button class="btn mSel" data-level="2">入门</button>
        <button class="btn mSel" data-level="3">中级</button>
        <button class="btn mSel" data-level="4">高级</button>
        <button class="btn mSel" data-level="5">大师</button>
      </div>
    </div>

    <div class="mGroup" id="mGroupSide">
      <div class="mLabel">执棋方</div>
      <div class="mBtns">
        <button id="mSideRed" class="btn mSel on">我执红</button>
        <button id="mSideBlack" class="btn mSel">我执黑</button>
      </div>
      <div class="mHint">切换执棋方将开启新的一局</div>
    </div>

    <button id="mClose" class="btn mClose">关闭</button>
  </div>
</div>

<script src="js/ai.js?v=3.1"></script>
<script src="js/book.js?v=3.1"></script>
<script src="js/ui.js?v=3.1"></script>
</body>
</html>
